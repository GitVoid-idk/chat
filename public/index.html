<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat Anônimo</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    #mensagens { height: 400px; overflow-y: auto; border: 1px solid #ccc;
                 border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .msg-sistema { color: #888; font-style: italic; font-size: 0.85rem; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 8px 16px; background: #4f46e5; color: white;
             border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Chat Anônimo</h2>
  <p>Seu apelido: <strong id="apelido">...</strong></p>
  <div id="mensagens"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Digite sua mensagem..." maxlength="300"/>
    <button type="submit">Enviar</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const div = document.getElementById("mensagens");

    socket.on("apelido", (nome) => {
      document.getElementById("apelido").textContent = nome;
    });

    socket.on("mensagem", ({ autor, texto }) => {
      const p = document.createElement("p");
      p.className = autor === "Sistema" ? "msg-sistema" : "";
      p.textContent = `${autor}: ${texto}`;
      div.appendChild(p);
      div.scrollTop = div.scrollHeight;
    });

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("input");
      if (input.value.trim()) {
        socket.emit("mensagem", input.value);
        input.value = "";
      }
    });
  </script>
</body>
</html>
