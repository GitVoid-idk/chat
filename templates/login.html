<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — Entrar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      color: #1e293b;
      margin-bottom: 0.3rem;
    }
    .sub {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.4rem;
    }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      color: #1e293b;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1rem;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%;
      padding: 11px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #4f46e5; }
    .erro {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💬</div>
    <h1>Chat dos Amigos</h1>
    <p class="sub">Entre com seu nome e a senha do grupo</p>

    {% if erro %}
    <div class="erro">{{ erro }}</div>
    {% endif %}

    <form method="post" action="/login">
      <label for="nome">Seu nome</label>
      <input type="text" id="nome" name="nome" placeholder="Como quer ser chamado?" maxlength="30" required autofocus>

      <label for="senha">Senha do grupo</label>
      <input type="password" id="senha" name="senha" placeholder="••••••••" required>

      <button type="submit">Entrar no chat →</button>
    </form>
  </div>
</body>
</html>
