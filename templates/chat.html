<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat dos Amigos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 640px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: white;
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ── Cabeçalho ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1.5px solid #f1f5f9;
      background: white;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 40px; height: 40px;
      background: #ede9fe;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .header-info h2 { font-size: 1rem; color: #1e293b; font-weight: 700; }
    .header-info small { font-size: 0.78rem; color: #94a3b8; }
    .badge-nome {
      background: #ede9fe;
      color: #6366f1;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
    }
    .logout {
      color: #94a3b8;
      font-size: 0.8rem;
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 6px;
      transition: background .2s;
    }
    .logout:hover { background: #f1f5f9; color: #64748b; }

    /* ── Mensagens ── */
    #mensagens {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg-sistema {
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
      font-style: italic;
      padding: 2px 0;
    }
    .msg-linha {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .msg-linha.proprio { align-self: flex-end; align-items: flex-end; }
    .msg-linha.outro   { align-self: flex-start; align-items: flex-start; }
    .msg-autor {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 3px;
      padding: 0 4px;
    }
    .msg-balao {
      padding: 9px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }
    .proprio .msg-balao {
      background: #6366f1;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .outro .msg-balao {
      background: #f1f5f9;
      color: #1e293b;
      border-bottom-left-radius: 4px;
    }
    .msg-hora {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 3px;
      padding: 0 4px;
    }

    /* ── Input ── */
    footer {
      padding: 1rem 1.25rem;
      border-top: 1.5px solid #f1f5f9;
      background: white;
    }
    form {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #input {
      flex: 1;
      padding: 10px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 24px;
      font-size: 0.95rem;
      color: #1e293b;
      outline: none;
      transition: border-color .2s;
      background: #f8fafc;
    }
    #input:focus { border-color: #6366f1; background: white; }
    button[type=submit] {
      width: 42px; height: 42px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
      flex-shrink: 0;
    }
    button[type=submit]:hover { background: #4f46e5; }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="header-left">
      <div class="avatar">💬</div>
      <div class="header-info">
        <h2>Chat dos Amigos</h2>
        <small>histórico salvo</small>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="badge-nome">{{ nome }}</span>
      <a href="/logout" class="logout">Sair</a>
    </div>
  </header>

  <div id="mensagens">
    {% for msg in historico %}
      {% if msg.autor == "Sistema" %}
        <p class="msg-sistema">{{ msg.texto }}</p>
      {% else %}
        <div class="msg-linha {% if msg.autor == nome %}proprio{% else %}outro{% endif %}">
          {% if msg.autor != nome %}
            <span class="msg-autor">{{ msg.autor }}</span>
          {% endif %}
          <div class="msg-balao">{{ msg.texto }}</div>
          <span class="msg-hora">{{ msg.hora }}</span>
        </div>
      {% endif %}
    {% endfor %}
  </div>

  <footer>
    <form id="form">
      <input id="input" type="text" placeholder="Digite uma mensagem..." maxlength="300" autocomplete="off"/>
      <button type="submit">➤</button>
    </form>
  </footer>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const meuNome = {{ nome | tojson }};
  const socket = io();
  const divMsgs = document.getElementById("mensagens");

  // Scroll para o fim ao carregar
  divMsgs.scrollTop = divMsgs.scrollHeight;

  socket.on("connect", () => {
    socket.emit("entrar", { nome: meuNome });
  });

  function adicionarMsg({ autor, texto, hora }) {
    if (autor === "Sistema") {
      const p = document.createElement("p");
      p.className = "msg-sistema";
      p.textContent = texto;
      divMsgs.appendChild(p);
    } else {
      const wrap = document.createElement("div");
      wrap.className = "msg-linha " + (autor === meuNome ? "proprio" : "outro");

      if (autor !== meuNome) {
        const span = document.createElement("span");
        span.className = "msg-autor";
        span.textContent = autor;
        wrap.appendChild(span);
      }

      const balao = document.createElement("div");
      balao.className = "msg-balao";
      balao.textContent = texto;
      wrap.appendChild(balao);

      const horaEl = document.createElement("span");
      horaEl.className = "msg-hora";
      horaEl.textContent = hora;
      wrap.appendChild(horaEl);

      divMsgs.appendChild(wrap);
    }
    divMsgs.scrollTop = divMsgs.scrollHeight;
  }

  socket.on("mensagem", adicionarMsg);

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("input");
    const texto = input.value.trim();
    if (texto) {
      socket.emit("mensagem", { texto });
      input.value = "";
    }
  });
</script>
</body>
</html>
